{% extends "base/storefront_base.html" %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="mb-4">Staff Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">{{ form.username }}</div>
            <div class="mb-3">{{ form.password }}</div>
            {% if form.errors %}<div class="text-danger mb-3">Invalid username or password.</div>{% endif %}
            <button type="submit" class="btn btn-dark w-100">Login</button>
        </form>
    </div>
</div>
{% endblock %}
